name: Shared checks

on:
  workflow_call:
    inputs:
      dependency-review:
        description: Review dependency changes for licences and known vulnerabilities. Public repositories only.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows
        uses: $/.github/actions/workflow-checks
        with:
          github-token: ${{ github.token }}

  dependencies:
    name: Dependencies
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: BSStudio/.github/.github/dependency-review.yml@main
          # The file is public, but unauthenticated requests share the runner's per-IP rate limit.
          external-repo-token: ${{ github.token }}
